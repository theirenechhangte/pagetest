<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MzSRLM — Under Construction</title>
<style>
  * { box-sizing: border-box; }

  html, body {
    width: 100%;
    min-height: 100%;
    margin: 0;
  }

  body {
    min-height: 100vh;
    display: flex;
    align-items: top;
    justify-content: center;
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
    color: #173f68;
    background:
      radial-gradient(circle at 15% 20%, rgba(21,91,152,.10), transparent 28%),
      radial-gradient(circle at 85% 80%, rgba(13,71,125,.10), transparent 30%),
      #f5f8fb;
  }

  .scene {
    position: relative;
    width: min(760px, 92vw);
    text-align: center;
    padding: 54px 28px 48px;
  }

  .glow {
    position: absolute;
    inset: 12% 15%;
    border-radius: 50%;
    background: rgba(13,71,125,.08);
    filter: blur(55px);
    animation: pulse 3.5s ease-in-out infinite;
    pointer-events: none;
  }

  .construction {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 116px;
    height: 116px;
    margin-bottom: 28px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 16px 45px rgba(23,63,104,.12);
    animation: float 3s ease-in-out infinite;
  }

  .helmet {
    position: relative;
    width: 62px;
    height: 42px;
    border: 5px solid #0d477d;
    border-bottom: 0;
    border-radius: 42px 42px 8px 8px;
  }

  .helmet::before {
    content: "";
    position: absolute;
    left: -12px;
    right: -12px;
    bottom: -8px;
    height: 9px;
    border-radius: 8px;
    background: #0d477d;
  }

  .helmet::after {
    content: "";
    position: absolute;
    top: -12px;
    left: 50%;
    width: 5px;
    height: 18px;
    border-radius: 5px;
    background: #0d477d;
    transform: translateX(-50%);
  }

  .kicker {
    position: relative;
    margin-bottom: 10px;
    font-size: 12px;
    font-weight: 800;
    letter-spacing: .16em;
    color: #6d7c91;
  }

  h1 {
    position: relative;
    margin: 0;
    font-size: clamp(32px, 6vw, 52px);
    line-height: 1.08;
    letter-spacing: -.025em;
    color: #173f68;
  }

  .subtitle {
    position: relative;
    max-width: 590px;
    margin: 18px auto 0;
    font-size: clamp(15px, 2.5vw, 18px);
    line-height: 1.6;
    color: #5d7085;
  }

  .progress {
    position: relative;
    width: min(430px, 82vw);
    height: 8px;
    margin: 30px auto 0;
    overflow: hidden;
    border-radius: 10px;
    background: #dce6ef;
  }

  .progress::after {
    content: "";
    position: absolute;
    top: 0;
    left: -35%;
    width: 35%;
    height: 100%;
    border-radius: inherit;
    background: #0d477d;
    animation: loading 1.8s ease-in-out infinite;
  }

  .dots {
    position: relative;
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-top: 20px;
  }

  .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #0d477d;
    animation: dot 1.3s ease-in-out infinite;
  }

  .dot:nth-child(2) { animation-delay: .18s; }
  .dot:nth-child(3) { animation-delay: .36s; }

  .footer {
    position: relative;
    margin-top: 34px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .06em;
    color: #8a98a8;
    text-transform: uppercase;
  }

  @keyframes float {
    0%, 100% { transform: translateY(0) rotate(-1deg); }
    50% { transform: translateY(-9px) rotate(1deg); }
  }

  @keyframes pulse {
    0%, 100% { opacity: .45; transform: scale(.92); }
    50% { opacity: .8; transform: scale(1.06); }
  }

  @keyframes loading {
    0% { left: -35%; }
    55%, 100% { left: 100%; }
  }

  @keyframes dot {
    0%, 60%, 100% { transform: translateY(0); opacity: .45; }
    30% { transform: translateY(-7px); opacity: 1; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .01ms !important;
      animation-iteration-count: 1 !important;
    }
  }

  @media (max-width: 480px) {
    .scene { padding: 38px 18px 34px; }
    .construction { width: 96px; height: 96px; margin-bottom: 22px; }
    .helmet { transform: scale(.86); }
    .subtitle { line-height: 1.5; }
  }
</style>
</head>
<body>
  <main class="scene" aria-label="Page under construction">
    <div class="glow"></div>

    <div class="construction" aria-hidden="true">
      <div class="helmet"></div>
    </div>

    <div class="kicker">MIZORAM STATE RURAL LIVELIHOODS MISSION</div>

    <h1>Under Construction</h1>

    <p class="subtitle">
      This page is currently being developed.<br>
      Please check back soon for the completed module.
    </p>

    <div class="progress" aria-hidden="true"></div>

    <div class="dots" aria-hidden="true">
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
    </div>

    <div class="footer">MzSRLM Dashboard</div>
  </main>
</body>
</html>
